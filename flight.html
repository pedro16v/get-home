<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brisbane → Porto — Flight Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <style>
    :root {
      --font: "Poppins", system-ui, sans-serif;
      --color-ink: #1e293b;
      --color-ink-muted: #64748b;
      --color-bg: #f0f4ff;
      --color-card: #ffffff;
      --color-flight: #3b82f6;
      --color-flight-light: #dbeafe;
      --color-layover: #f59e0b;
      --color-layover-light: #fef3c7;
      --color-drive: #10b981;
      --color-drive-light: #d1fae5;
      --color-progress: #ec4899;
      --color-track: #e2e8f0;
      --color-complete: #22c55e;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
      --shadow-lg: 0 4px 20px rgba(0,0,0,.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-ink: #e2e8f0;
        --color-ink-muted: #94a3b8;
        --color-bg: #0f172a;
        --color-card: #1e293b;
        --color-track: #334155;
        --color-flight-light: #1e3a5f;
        --color-layover-light: #422006;
        --color-drive-light: #064e3b;
        --shadow: 0 1px 3px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
        --shadow-lg: 0 4px 20px rgba(0,0,0,.4);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      color: var(--color-ink);
      background: var(--color-bg);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Status Bar ── */
    .status-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-track);
      padding: 12px 20px;
      transition: all .3s;
    }
    @media (prefers-color-scheme: dark) {
      .status-bar { background: rgba(15,23,42,.85); }
    }
    .status-bar__inner {
      max-width: 600px;
      margin: 0 auto;
    }
    .status-bar__text {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-bar__text i {
      font-size: 14px;
    }
    .status-bar__track {
      height: 4px;
      background: var(--color-track);
      border-radius: 2px;
      overflow: hidden;
    }
    .status-bar__fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--color-flight), var(--color-progress));
      transition: width .5s ease;
      width: 0%;
    }

    /* ── Header ── */
    .flight-header {
      text-align: center;
      padding: 40px 20px 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .flight-header__route {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .flight-header__route i {
      color: var(--color-flight);
      font-size: 0.7em;
    }
    .flight-header__sub {
      color: var(--color-ink-muted);
      font-size: 14px;
      margin-top: 6px;
      font-weight: 500;
    }
    .flight-header__duration {
      display: inline-block;
      background: var(--color-flight-light);
      color: var(--color-flight);
      font-size: 13px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 20px;
      margin-top: 12px;
    }

    /* ── Timeline ── */
    .timeline {
      max-width: 600px;
      margin: 0 auto;
      padding: 10px 20px 40px;
      position: relative;
    }

    .segment {
      display: flex;
      gap: 16px;
      position: relative;
    }

    /* Left rail */
    .segment__rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 40px;
      flex-shrink: 0;
    }

    .segment__node {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: white;
      flex-shrink: 0;
      z-index: 2;
      transition: all .3s;
      position: relative;
    }
    .segment__node--drive { background: var(--color-drive); }
    .segment__node--wait, .segment__node--layover { background: var(--color-layover); }
    .segment__node--flight { background: var(--color-flight); }
    .segment__node--future {
      background: var(--color-track);
      color: var(--color-ink-muted);
    }
    .segment__node--complete {
      background: var(--color-complete) !important;
    }
    .segment__node--active {
      box-shadow: 0 0 0 4px rgba(236, 72, 153, .25);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(236, 72, 153, .25); }
      50% { box-shadow: 0 0 0 8px rgba(236, 72, 153, .12); }
    }

    .segment__bar {
      width: 4px;
      height: 40px;
      background: var(--color-track);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }
    .segment__bar--drive {
      background: repeating-linear-gradient(
        to bottom,
        var(--color-track) 0px,
        var(--color-track) 6px,
        transparent 6px,
        transparent 12px
      );
    }
    .segment__bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 0%;
      border-radius: 2px;
      transition: height .5s ease;
    }
    .segment__bar-fill--drive { background: var(--color-drive); }
    .segment__bar-fill--wait, .segment__bar-fill--layover { background: var(--color-layover); }
    .segment__bar-fill--flight { background: var(--color-flight); }

    /* ── Flight Track (inside card) ── */
    .card__track {
      position: relative;
      height: 28px;
      flex: 1;
      display: flex;
      align-items: center;
      margin: 0 4px;
    }
    .card__track-line {
      height: 2px;
      width: 100%;
      background: var(--color-track);
      border-radius: 1px;
    }
    .card__track-fill {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      height: 2px;
      background: var(--color-flight);
      border-radius: 1px;
      width: 0%;
      transition: width .5s ease;
    }
    .card__track-plane {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      color: var(--color-flight);
      font-size: 14px;
      transition: left .5s ease;
      z-index: 2;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.15));
    }
    .card__track-plane--hidden { opacity: 0; }
    .card__track-plane--complete { color: var(--color-complete); }

    /* ── Cards ── */
    .segment__card {
      flex: 1;
      background: var(--color-card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 8px;
      border-left: 4px solid transparent;
      transition: all .3s;
      position: relative;
    }
    .segment__card--drive { border-left-color: var(--color-drive); }
    .segment__card--wait, .segment__card--layover { border-left-color: var(--color-layover); }
    .segment__card--flight { border-left-color: var(--color-flight); }
    .segment__card--future { opacity: .5; }
    .segment__card--active {
      box-shadow: var(--shadow-lg);
      opacity: 1;
    }
    .segment__card--complete { opacity: .7; }

    .card__header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .card__type {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .card__type--drive { background: var(--color-drive-light); color: var(--color-drive); }
    .card__type--wait { background: var(--color-layover-light); color: var(--color-layover); }
    .card__type--layover { background: var(--color-layover-light); color: var(--color-layover); }
    .card__type--flight { background: var(--color-flight-light); color: var(--color-flight); }

    .card__flight-no {
      font-size: 13px;
      font-weight: 700;
      color: var(--color-flight);
    }

    .card__route {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .card__airport {
      text-align: center;
    }
    .card__code {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
    }
    .card__city {
      font-size: 11px;
      color: var(--color-ink-muted);
      font-weight: 500;
    }

    .card__times {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--color-ink-muted);
    }
    .card__time {
      font-weight: 600;
      color: var(--color-ink);
    }
    .card__tz {
      font-size: 11px;
      color: var(--color-ink-muted);
      font-weight: 400;
    }
    .card__duration {
      text-align: center;
      font-size: 12px;
      color: var(--color-ink-muted);
    }

    .card__label {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .card__detail {
      font-size: 13px;
      color: var(--color-ink-muted);
    }

    .card__boarding {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-layover);
      background: var(--color-layover-light);
      padding: 4px 10px;
      border-radius: 8px;
    }
    .card__boarding i { font-size: 11px; }

    /* ── Destination ── */
    .destination {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px 60px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding-left: 76px;
    }
    .destination__node {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--color-progress);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      position: absolute;
      left: 18px;
    }
    .destination__info {}
    .destination__flag { font-size: 28px; }
    .destination__city {
      font-size: 22px;
      font-weight: 700;
    }
    .destination__time {
      font-size: 13px;
      color: var(--color-ink-muted);
      font-weight: 500;
    }

    .destination-wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px 60px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .destination-wrap .destination__content {
      margin-left: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ── Arrived celebration ── */
    .arrived-banner {
      display: none;
      text-align: center;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .arrived-banner--show { display: block; }
    .arrived-banner__text {
      font-size: 24px;
      font-weight: 700;
    }
    .arrived-banner__sub {
      color: var(--color-ink-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card__code { font-size: 17px; }
      .segment__card { padding: 12px; }
      .flight-header { padding: 30px 16px 16px; }
      .timeline { padding: 10px 16px 40px; }
    }
  </style>
</head>
<body>

  <!-- Sticky status bar -->
  <div class="status-bar" id="statusBar">
    <div class="status-bar__inner">
      <div class="status-bar__text" id="statusText">
        <i class="fa-solid fa-clock"></i>
        <span>Loading...</span>
      </div>
      <div class="status-bar__track">
        <div class="status-bar__fill" id="statusFill"></div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="flight-header">
    <div class="flight-header__route">
      <span>🇦🇺 Brisbane</span>
      <i class="fa-solid fa-plane"></i>
      <span>Porto 🇵🇹</span>
    </div>
    <p class="flight-header__sub">Thu 26 Mar – Fri 27 Mar 2026</p>
    <span class="flight-header__duration">
      <i class="fa-solid fa-route"></i>&ensp;33h 10m total journey
    </span>
  </header>

  <!-- Timeline container -->
  <div class="timeline" id="timeline"></div>

  <!-- Destination -->
  <div class="destination-wrap" id="destinationWrap">
    <div class="destination__node" id="destNode">🇵🇹</div>
    <div class="destination__content">
      <div>
        <div class="destination__city">Porto</div>
        <div class="destination__time">Fri 27 Mar, 9:55am WET</div>
      </div>
    </div>
  </div>

  <!-- Arrived banner -->
  <div class="arrived-banner" id="arrivedBanner">
    <div class="arrived-banner__text">🎉 Bem-vindo ao Porto!</div>
    <div class="arrived-banner__sub">You've arrived — enjoy Portugal!</div>
  </div>

<script>
// ── Itinerary Data ──
const SEGMENTS = [
  {
    id: 'drive-home-bne',
    type: 'drive',
    label: 'Home → BNE Airport',
    icon: 'fa-solid fa-car',
    from: { code: null, city: 'Home', flag: '🏠' },
    to:   { code: 'BNE', city: 'Brisbane', flag: '🇦🇺' },
    departLocal: '10:45am',
    arriveLocal: '11:00am',
    departTZ: 'AEST',
    arriveTZ: 'AEST',
    departUTC: Date.UTC(2026, 2, 26, 0, 45),
    arriveUTC: Date.UTC(2026, 2, 26, 1, 0),
    durationLabel: '15 min',
    boarding: null
  },
  {
    id: 'wait-bne',
    type: 'wait',
    label: 'BNE Airport',
    icon: 'fa-solid fa-clock',
    from: { code: 'BNE', city: 'Brisbane', flag: '🇦🇺' },
    to:   null,
    departLocal: '11:00am',
    arriveLocal: '1:00pm',
    departTZ: 'AEST',
    arriveTZ: 'AEST',
    departUTC: Date.UTC(2026, 2, 26, 1, 0),
    arriveUTC: Date.UTC(2026, 2, 26, 3, 0),
    durationLabel: '2h',
    boarding: {
      time: '12:30pm',
      utc: Date.UTC(2026, 2, 26, 2, 30)
    }
  },
  {
    id: 'flight-jq65',
    type: 'flight',
    flightNo: 'JQ65',
    icon: 'fa-solid fa-plane',
    from: { code: 'BNE', city: 'Brisbane', flag: '🇦🇺' },
    to:   { code: 'BKK', city: 'Bangkok', flag: '🇹🇭' },
    departLocal: '1:00pm',
    arriveLocal: '7:00pm',
    departTZ: 'AEST',
    arriveTZ: 'ICT',
    departUTC: Date.UTC(2026, 2, 26, 3, 0),
    arriveUTC: Date.UTC(2026, 2, 26, 12, 0),
    durationLabel: '9h',
    boarding: null
  },
  {
    id: 'layover-bkk',
    type: 'layover',
    label: 'BKK Layover',
    icon: 'fa-solid fa-mug-hot',
    from: { code: 'BKK', city: 'Bangkok', flag: '🇹🇭' },
    to:   null,
    departLocal: '7:00pm',
    arriveLocal: '11:15pm',
    departTZ: 'ICT',
    arriveTZ: 'ICT',
    departUTC: Date.UTC(2026, 2, 26, 12, 0),
    arriveUTC: Date.UTC(2026, 2, 26, 16, 15),
    durationLabel: '4h 15m',
    boarding: {
      time: '~10:45pm',
      utc: Date.UTC(2026, 2, 26, 15, 45)
    }
  },
  {
    id: 'flight-tk69',
    type: 'flight',
    flightNo: 'TK69',
    icon: 'fa-solid fa-plane',
    from: { code: 'BKK', city: 'Bangkok', flag: '🇹🇭' },
    to:   { code: 'IST', city: 'Istanbul', flag: '🇹🇷' },
    departLocal: '11:15pm',
    arriveLocal: '6:10am',
    departTZ: 'ICT',
    arriveTZ: 'TRT',
    departUTC: Date.UTC(2026, 2, 26, 16, 15),
    arriveUTC: Date.UTC(2026, 2, 27, 3, 10),
    durationLabel: '10h 55m',
    boarding: null
  },
  {
    id: 'layover-ist',
    type: 'layover',
    label: 'IST Layover',
    icon: 'fa-solid fa-clock',
    from: { code: 'IST', city: 'Istanbul', flag: '🇹🇷' },
    to:   null,
    departLocal: '6:10am',
    arriveLocal: '7:55am',
    departTZ: 'TRT',
    arriveTZ: 'TRT',
    departUTC: Date.UTC(2026, 2, 27, 3, 10),
    arriveUTC: Date.UTC(2026, 2, 27, 4, 55),
    durationLabel: '1h 45m',
    boarding: {
      time: '~7:25am',
      utc: Date.UTC(2026, 2, 27, 4, 25)
    }
  },
  {
    id: 'flight-tk1445',
    type: 'flight',
    flightNo: 'TK1445',
    icon: 'fa-solid fa-plane',
    from: { code: 'IST', city: 'Istanbul', flag: '🇹🇷' },
    to:   { code: 'OPO', city: 'Porto', flag: '🇵🇹' },
    departLocal: '7:55am',
    arriveLocal: '9:55am',
    departTZ: 'TRT',
    arriveTZ: 'WET',
    departUTC: Date.UTC(2026, 2, 27, 4, 55),
    arriveUTC: Date.UTC(2026, 2, 27, 9, 55),
    durationLabel: '5h',
    boarding: null
  }
];

const JOURNEY_START = SEGMENTS[0].departUTC;
const JOURNEY_END = SEGMENTS[SEGMENTS.length - 1].arriveUTC;

// ── Time Override ──
// Use ?t=2026-03-26T06:00Z (ISO 8601 UTC) to simulate a point in time
// Or use ?t=50 for a percentage through the journey (0–100)
function getTime() {
  const param = new URLSearchParams(window.location.search).get('t');
  if (!param) return Date.now();
  const pct = Number(param);
  if (!isNaN(pct) && pct >= 0 && pct <= 100) {
    return JOURNEY_START + (JOURNEY_END - JOURNEY_START) * (pct / 100);
  }
  const parsed = Date.parse(param);
  if (!isNaN(parsed)) return parsed;
  return Date.now();
}

// ── Helpers ──
function formatRemaining(ms) {
  const totalMin = Math.ceil(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h === 0) return `${m}m`;
  return m > 0 ? `${h}h ${m}m` : `${h}h`;
}

// ── Render Timeline ──
function renderTimeline() {
  const container = document.getElementById('timeline');
  container.innerHTML = '';

  SEGMENTS.forEach((seg, i) => {
    const el = document.createElement('div');
    el.className = 'segment';
    el.id = `seg-${seg.id}`;

    el.innerHTML = `
      <div class="segment__rail">
        <div class="segment__node segment__node--${seg.type}" id="node-${seg.id}">
          <i class="${seg.icon}"></i>
        </div>
        <div class="segment__bar ${seg.type === 'drive' ? 'segment__bar--drive' : ''}"
             id="bar-${seg.id}">
          <div class="segment__bar-fill segment__bar-fill--${seg.type}" id="fill-${seg.id}"></div>
        </div>
      </div>
      <div class="segment__card segment__card--${seg.type}" id="card-${seg.id}">
        ${renderCardContent(seg)}
      </div>
    `;

    container.appendChild(el);
  });
}

function renderCardContent(seg) {
  if (seg.type === 'flight') {
    return `
      <div class="card__header">
        <span class="card__type card__type--flight">Flight</span>
        <span class="card__flight-no">${seg.flightNo}</span>
      </div>
      <div class="card__route">
        <div class="card__airport">
          <div class="card__code">${seg.from.flag} ${seg.from.code}</div>
          <div class="card__city">${seg.from.city}</div>
        </div>
        <div class="card__track" id="track-${seg.id}">
          <div class="card__track-line"></div>
          <div class="card__track-fill" id="trackfill-${seg.id}"></div>
          <i class="fa-solid fa-plane card__track-plane card__track-plane--hidden" id="trackplane-${seg.id}"></i>
        </div>
        <div class="card__airport">
          <div class="card__code">${seg.to.code} ${seg.to.flag}</div>
          <div class="card__city">${seg.to.city}</div>
        </div>
      </div>
      <div class="card__times">
        <div><span class="card__time">${seg.departLocal}</span> <span class="card__tz">${seg.departTZ}</span></div>
        <div class="card__duration"><i class="fa-solid fa-clock"></i> ${seg.durationLabel}</div>
        <div><span class="card__time">${seg.arriveLocal}</span> <span class="card__tz">${seg.arriveTZ}</span></div>
      </div>
    `;
  }

  if (seg.type === 'drive') {
    return `
      <div class="card__header">
        <span class="card__type card__type--drive">Drive</span>
      </div>
      <div class="card__label">${seg.label}</div>
      <div class="card__detail">
        ${seg.departLocal} → ${seg.arriveLocal} <span class="card__tz">${seg.departTZ}</span>
        &nbsp;·&nbsp; ${seg.durationLabel}
      </div>
    `;
  }

  // wait / layover
  const typeLabel = seg.type === 'wait' ? 'At Airport' : 'Layover';
  return `
    <div class="card__header">
      <span class="card__type card__type--${seg.type}">${typeLabel}</span>
    </div>
    <div class="card__label">${seg.from.flag} ${seg.from.code} — ${seg.from.city}</div>
    <div class="card__detail">
      ${seg.departLocal} → ${seg.arriveLocal} <span class="card__tz">${seg.departTZ}</span>
      &nbsp;·&nbsp; ${seg.durationLabel}
    </div>
    ${seg.boarding ? `
      <div class="card__boarding" id="boarding-${seg.id}">
        <i class="fa-solid fa-door-open"></i>
        Est. boarding ${seg.boarding.time}
      </div>
    ` : ''}
  `;
}

// ── Progress Updates ──
function updateProgress() {
  const now = getTime();
  const statusText = document.getElementById('statusText');
  const statusFill = document.getElementById('statusFill');
  const arrivedBanner = document.getElementById('arrivedBanner');

  // Overall progress
  const overallFraction = Math.max(0, Math.min(1,
    (now - JOURNEY_START) / (JOURNEY_END - JOURNEY_START)
  ));
  statusFill.style.width = `${(overallFraction * 100).toFixed(1)}%`;

  // Before journey
  if (now < JOURNEY_START) {
    const remaining = JOURNEY_START - now;
    const days = Math.floor(remaining / 86400000);
    const remAfterDays = remaining % 86400000;
    let countdownStr = formatRemaining(remAfterDays);
    if (days > 0) countdownStr = `${days}d ${countdownStr}`;
    statusText.innerHTML = `<i class="fa-solid fa-hourglass-half"></i><span>Departure in ${countdownStr}</span>`;
    statusFill.style.width = '0%';

    // All segments future
    SEGMENTS.forEach(seg => {
      setSegmentState(seg.id, 'future');
    });
    return;
  }

  // After journey
  if (now > JOURNEY_END) {
    statusText.innerHTML = `<i class="fa-solid fa-check-circle"></i><span>Arrived in Porto! 🇵🇹</span>`;
    statusFill.style.width = '100%';
    arrivedBanner.classList.add('arrived-banner--show');
    document.getElementById('destNode').style.background = 'var(--color-complete)';

    SEGMENTS.forEach(seg => {
      setSegmentState(seg.id, 'complete');
    });
    return;
  }

  arrivedBanner.classList.remove('arrived-banner--show');

  // Find active segment
  for (let i = 0; i < SEGMENTS.length; i++) {
    const seg = SEGMENTS[i];

    if (now < seg.departUTC) {
      setSegmentState(seg.id, 'future');
      continue;
    }

    if (now > seg.arriveUTC) {
      setSegmentState(seg.id, 'complete');
      continue;
    }

    // Active segment
    const fraction = (now - seg.departUTC) / (seg.arriveUTC - seg.departUTC);
    setSegmentState(seg.id, 'active', fraction);

    // Status bar text
    const remaining = seg.arriveUTC - now;
    let statusLabel = '';
    if (seg.type === 'flight') {
      statusLabel = `Flight ${seg.flightNo} ${seg.from.code} → ${seg.to.code}`;
    } else if (seg.type === 'drive') {
      statusLabel = seg.label;
    } else if (seg.type === 'wait') {
      statusLabel = `At ${seg.from.code} Airport`;
    } else {
      statusLabel = `${seg.from.code} Layover`;
    }

    const icon = seg.type === 'flight' ? 'fa-plane' :
                 seg.type === 'drive' ? 'fa-car' : 'fa-clock';
    statusText.innerHTML = `<i class="fa-solid ${icon}"></i><span>${statusLabel} — ${formatRemaining(remaining)} remaining</span>`;

    // Check boarding countdowns for upcoming wait/layover segments
    updateBoardingCountdowns(now);

    // Mark remaining as future
    for (let j = i + 1; j < SEGMENTS.length; j++) {
      setSegmentState(SEGMENTS[j].id, 'future');
    }
    break;
  }
}

function setSegmentState(id, state, fraction) {
  const node = document.getElementById(`node-${id}`);
  const fill = document.getElementById(`fill-${id}`);
  const card = document.getElementById(`card-${id}`);
  const trackFill = document.getElementById(`trackfill-${id}`);
  const trackPlane = document.getElementById(`trackplane-${id}`);

  if (!node || !fill || !card) return;

  // Reset classes
  node.classList.remove('segment__node--future', 'segment__node--complete', 'segment__node--active');
  card.classList.remove('segment__card--future', 'segment__card--complete', 'segment__card--active');

  if (state === 'future') {
    node.classList.add('segment__node--future');
    card.classList.add('segment__card--future');
    fill.style.height = '0%';
    if (trackFill) trackFill.style.width = '0%';
    if (trackPlane) { trackPlane.classList.add('card__track-plane--hidden'); trackPlane.style.left = '0%'; }
  } else if (state === 'complete') {
    node.classList.add('segment__node--complete');
    node.innerHTML = '<i class="fa-solid fa-check"></i>';
    card.classList.add('segment__card--complete');
    fill.style.height = '100%';
    if (trackFill) trackFill.style.width = '100%';
    if (trackPlane) {
      trackPlane.classList.remove('card__track-plane--hidden');
      trackPlane.classList.add('card__track-plane--complete');
      trackPlane.style.left = '100%';
    }
  } else if (state === 'active') {
    node.classList.add('segment__node--active');
    card.classList.add('segment__card--active');
    const pct = ((fraction || 0) * 100).toFixed(1);
    fill.style.height = `${pct}%`;
    if (trackFill) trackFill.style.width = `${pct}%`;
    if (trackPlane) {
      trackPlane.classList.remove('card__track-plane--hidden');
      trackPlane.style.left = `${pct}%`;
    }
  }
}

function updateBoardingCountdowns(now) {
  SEGMENTS.forEach(seg => {
    if (!seg.boarding) return;
    const boardingEl = document.getElementById(`boarding-${seg.id}`);
    if (!boardingEl) return;

    const timeUntilBoarding = seg.boarding.utc - now;
    if (timeUntilBoarding > 0 && timeUntilBoarding < 7200000) {
      boardingEl.innerHTML = `<i class="fa-solid fa-door-open"></i> Boarding in ${formatRemaining(timeUntilBoarding)}`;
      boardingEl.style.animation = 'pulse 2s ease-in-out infinite';
    } else if (timeUntilBoarding <= 0 && now < seg.arriveUTC) {
      boardingEl.innerHTML = `<i class="fa-solid fa-door-open"></i> Boarding now!`;
    }
  });
}

// ── Scroll to active ──
let lastActiveId = null;
function scrollToActive() {
  const active = document.querySelector('.segment__card--active');
  if (!active) return;
  if (active.id === lastActiveId) return; // only scroll on segment change
  lastActiveId = active.id;
  active.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ── Init ──
renderTimeline();
updateProgress();
scrollToActive();
setInterval(() => { updateProgress(); scrollToActive(); }, 30000);
</script>
